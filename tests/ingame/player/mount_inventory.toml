# Riding a donkey with a chest, the inventory key opens the donkey's own
# inventory: its saddle, and three rows of its chest.

[[step]]
chat = "/tp @s 4700.5 -60 600.5 0 20"

[[step]]
wait_ms = 1500

[[step]]
chat = "/summon minecraft:donkey 4700.5 -60 602.5 {NoAI:1b,Silent:1b,PersistenceRequired:1b,Tame:1b,ChestedHorse:1b,Rotation:[0f,0f],equipment:{saddle:{id:\"minecraft:saddle\",count:1}}}"

[[step]]
expect = { entity = "donkey" }

[[step]]
look_at = [4700.5, -59.2, 602.5]

[[step]]
wait_ms = 300

[[step]]
mouse_down = "right"

[[step]]
wait_ms = 100

[[step]]
mouse_up = "right"

[[step]]
expect = { riding = true }

[[step]]
press = { action = "key.inventory" }

[[step]]
expect = { slot = 0, item = "saddle" }

[[step]]
wait_ms = 500

[[step]]
screenshot = "donkey"

[[step]]
close_menu = true

[[step]]
chat = "/kill @e[type=minecraft:donkey,distance=..10]"
