# Reading a written book in hand, turning its page, and reading one on a
# lectern.

[[step]]
chat = "/tp @s 3700.5 -60 600.5 0 -60"

[[step]]
wait_ms = 1500

[[step]]
chat = "/item replace entity @s weapon.mainhand with minecraft:written_book[minecraft:written_book_content={title:\"Rules\",author:\"Void\",pages:[\"The first page of the rules. Be kind to one another, and mind the void below you.\",{text:\"The second page\",bold:true}]}]"

[[step]]
expect = { slot = 36, item = "written_book" }

[[step]]
mouse_down = "right"

[[step]]
wait_ms = 100

[[step]]
mouse_up = "right"

[[step]]
wait_ms = 700

[[step]]
screenshot = "first_page"

# The page forward button, in GUI units at the harness's scale of three.
[[step]]
cursor = [244.5, 165.5]

[[step]]
mouse_down = "left"

[[step]]
wait_ms = 100

[[step]]
mouse_up = "left"

[[step]]
wait_ms = 300

[[step]]
screenshot = "second_page"

# Done.
[[step]]
cursor = [213.0, 206.0]

[[step]]
mouse_down = "left"

[[step]]
wait_ms = 100

[[step]]
mouse_up = "left"

[[step]]
wait_ms = 300

[[step]]
chat = "/setblock 3700 -60 602 minecraft:lectern[has_book=true,facing=north]{Book:{id:\"minecraft:written_book\",count:1,components:{\"minecraft:written_book_content\":{title:\"Lore\",author:\"Void\",pages:[\"A page on the lectern.\",\"Its second page.\"]}}}}"

[[step]]
chat = "/tp @s 3700.5 -60 600.5 0 30"

[[step]]
wait_ms = 800

[[step]]
look_at = [3700.5, -59.2, 602.5]

[[step]]
wait_ms = 300

[[step]]
mouse_down = "right"

[[step]]
wait_ms = 100

[[step]]
mouse_up = "right"

[[step]]
expect = { slot = 0, item = "written_book" }

[[step]]
cursor = [244.5, 165.5]

[[step]]
mouse_down = "left"

[[step]]
wait_ms = 100

[[step]]
mouse_up = "left"

[[step]]
wait_ms = 600

[[step]]
screenshot = "lectern_second_page"

[[step]]
close_menu = true
