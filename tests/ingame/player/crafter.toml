# The crafter's screen: its nine slots, one shut by a click on it empty,
# and what it would make shown beside them.

[[step]]
chat = "/tp @s 3600.5 -60 600.5 0 30"

[[step]]
wait_ms = 1500

[[step]]
chat = "/setblock 3600 -60 602 minecraft:crafter"

[[step]]
chat = "/item replace block 3600 -60 602 container.0 with minecraft:oak_log 3"

[[step]]
look_at = [3600.5, -59.5, 602.5]

[[step]]
wait_ms = 300

[[step]]
mouse_down = "right"

[[step]]
wait_ms = 100

[[step]]
mouse_up = "right"

[[step]]
expect = { slot = 0, item = "oak_log" }

# The middle slot, in GUI units at the harness's scale of three.
[[step]]
cursor = [177.0, 80.0]

[[step]]
mouse_down = "left"

[[step]]
wait_ms = 100

[[step]]
mouse_up = "left"

[[step]]
cursor = [250.0, 60.0]

[[step]]
wait_ms = 700

[[step]]
screenshot = "shut"

[[step]]
close_menu = true
