# A command block's screen, for an operator in creative mode: a right click
# opens it, the server's data fills it in, and Done sends what it shows.

# Another scene on this server may have turned the feedback off.
[[step]]
chat = "/gamerule send_command_feedback true"

[[step]]
chat = "/gamemode creative"

[[step]]
chat = "/tp @s 4900.5 -60 900.5 0 20"

[[step]]
wait_ms = 1500

[[step]]
chat = "/setblock 4900 -60 902 minecraft:command_block"

[[step]]
look_at = [4900.5, -59.5, 902.0]

[[step]]
wait_ms = 300

[[step]]
mouse_down = "right"

[[step]]
wait_ms = 100

[[step]]
mouse_up = "right"

[[step]]
wait_ms = 700

[[step]]
text = "say from the block"

[[step]]
wait_ms = 300

[[step]]
screenshot = "typed"

# Needs Redstone becomes Always Active.
[[step]]
cursor = [317, 175]

[[step]]
mouse_down = "left"

[[step]]
mouse_up = "left"

[[step]]
wait_ms = 300

[[step]]
screenshot = "always_active"

# Done.
[[step]]
cursor = [134, 202]

[[step]]
mouse_down = "left"

[[step]]
mouse_up = "left"

[[step]]
expect = { chat = "Command set: say from the block" }

# The block, always active now, runs what it was given.
[[step]]
expect = { chat = "from the block" }

[[step]]
chat = "/setblock 4900 -60 902 minecraft:air"

[[step]]
chat = "/gamemode survival"
