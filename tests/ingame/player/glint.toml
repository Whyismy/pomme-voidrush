# The enchantment glint: an enchanted sword in the hand and another in an
# item frame shimmer, beside a plain one that does not; an enchanted golden
# apple glints by its item's own component. A zombie in enchanted armor
# glints (on the right); the one in plain armor does not. The
# hotbar's and the inventory's icons glint as the items do.

[[step]]
chat = "/tp @s 1900.5 -60 599.5 0 10"

[[step]]
wait_ms = 1500

[[step]]
chat = "/fill 1898 -60 603 1902 -57 603 minecraft:smooth_stone"

[[step]]
chat = "/summon minecraft:item_frame 1899 -59 602 {Facing:2b,Fixed:1b,Item:{id:\"minecraft:diamond_sword\",count:1,components:{\"minecraft:enchantments\":{\"minecraft:sharpness\":5}}}}"

[[step]]
chat = "/summon minecraft:item_frame 1900 -59 602 {Facing:2b,Fixed:1b,Item:{id:\"minecraft:diamond_sword\",count:1}}"

[[step]]
chat = "/summon minecraft:item_frame 1901 -59 602 {Facing:2b,Fixed:1b,Item:{id:\"minecraft:enchanted_golden_apple\",count:1}}"

[[step]]
chat = "/summon minecraft:zombie 1898.5 -60 602.3 {NoAI:1b,Silent:1b,PersistenceRequired:1b,Rotation:[180f,0f],equipment:{head:{id:\"minecraft:diamond_helmet\",count:1,components:{\"minecraft:enchantments\":{\"minecraft:protection\":4}}},chest:{id:\"minecraft:diamond_chestplate\",count:1,components:{\"minecraft:enchantments\":{\"minecraft:protection\":4}}},legs:{id:\"minecraft:leather_leggings\",count:1,components:{\"minecraft:enchantments\":{\"minecraft:protection\":4}}},feet:{id:\"minecraft:iron_boots\",count:1,components:{\"minecraft:enchantments\":{\"minecraft:protection\":4}}}}}"

[[step]]
chat = "/summon minecraft:zombie 1902.5 -60 602.3 {NoAI:1b,Silent:1b,PersistenceRequired:1b,Rotation:[180f,0f],equipment:{head:{id:\"minecraft:diamond_helmet\",count:1},chest:{id:\"minecraft:diamond_chestplate\",count:1},legs:{id:\"minecraft:leather_leggings\",count:1},feet:{id:\"minecraft:iron_boots\",count:1}}}"

[[step]]
chat = "/item replace entity @s weapon.mainhand with minecraft:netherite_sword[minecraft:enchantments={\"minecraft:sharpness\":5}]"

[[step]]
chat = "/item replace entity @s hotbar.1 with minecraft:enchanted_book"

[[step]]
chat = "/item replace entity @s hotbar.2 with minecraft:diamond_sword"

[[step]]
chat = "/item replace entity @s hotbar.3 with minecraft:diamond_pickaxe[minecraft:enchantments={\"minecraft:efficiency\":5}]"

[[step]]
wait_ms = 1500

[[step]]
screenshot = "glint"

[[step]]
wait_ms = 1500

[[step]]
screenshot = "glint_later"

# The chat lines fade first: they lie over the inventory.
[[step]]
wait_ms = 11000

[[step]]
open_inventory = true

[[step]]
wait_ms = 800

[[step]]
screenshot = "inventory"
