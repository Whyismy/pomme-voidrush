# Invisibility and default skins: a zombie made invisible by the effect
# (hidden), a fire-resistant one in daylight (no hurt flash, its own
# texture), and a mannequin with no profile (one of vanilla's default skins,
# picked by its UUID).

[[step]]
wait_ms = 15000

[[step]]
chat = "/time set 6000"

[[step]]
chat = "/summon minecraft:zombie -2.5 -60 6.5 {NoAI:1b,Silent:1b,Tags:[\"fx\"]}"

[[step]]
chat = "/effect give @e[type=zombie,tag=fx] minecraft:invisibility infinite 0 true"

[[step]]
chat = "/summon minecraft:zombie 1.5 -60 6.5 {NoAI:1b,Silent:1b,Tags:[\"lit\"]}"

[[step]]
chat = "/effect give @e[type=zombie,tag=lit] minecraft:fire_resistance infinite 0 true"

[[step]]
chat = "/summon minecraft:mannequin 4.5 -60 6.5"

[[step]]
chat = "/tp @s 0.5 -59 -1.5 0 5"

[[step]]
wait_ms = 6000

[[step]]
screenshot = "check"
