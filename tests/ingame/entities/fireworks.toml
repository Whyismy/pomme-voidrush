# A firework rocket (vanilla FireworkEntityRenderer and FireworkParticles):
# climbing with its trail of sparks, then its stars going off: a red large
# ball that trails and fades to blue, and a green star.

[[step]]
wait_ms = 15000

[[step]]
chat = "/gamerule send_command_feedback false"

[[step]]
chat = "/time set 18000"

[[step]]
chat = "/gamemode spectator"

[[step]]
chat = "/tp @s 1000.5 -52 588.5 0 -15"

[[step]]
wait_ms = 2500

[[step]]
chat = "/summon minecraft:firework_rocket 1000.5 -59 604.5 {LifeTime:24,FireworksItem:{id:\"minecraft:firework_rocket\",count:1,components:{\"minecraft:fireworks\":{explosions:[{shape:\"large_ball\",colors:[I;16711680],fade_colors:[I;255],has_trail:1b},{shape:\"star\",colors:[I;65280]}]}}}}"

[[step]]
wait_ms = 700

[[step]]
screenshot = "climbing"

[[step]]
wait_ms = 750

[[step]]
screenshot = "burst"

[[step]]
wait_ms = 600

[[step]]
screenshot = "fading"

[[step]]
chat = "/gamemode creative"
