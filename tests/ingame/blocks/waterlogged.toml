# Waterlogged blocks show their water (vanilla meshes every block's fluid
# state): stairs, a slab and a fence holding water beside a plain water
# block, and the same blocks dry for comparison.

[[step]]
wait_ms = 15000

[[step]]
chat = "/gamemode creative"

[[step]]
chat = "/time set 6000"

[[step]]
chat = "/setblock -2 -60 4 minecraft:oak_stairs[waterlogged=true]"

[[step]]
chat = "/setblock -1 -60 4 minecraft:stone_slab[waterlogged=true]"

[[step]]
chat = "/setblock 0 -60 4 minecraft:oak_fence[waterlogged=true]"

[[step]]
chat = "/setblock 1 -60 4 minecraft:water"

[[step]]
chat = "/setblock -2 -60 7 minecraft:oak_stairs"

[[step]]
chat = "/setblock -1 -60 7 minecraft:stone_slab"

[[step]]
chat = "/setblock 0 -60 7 minecraft:oak_fence"

[[step]]
chat = "/tp @s -0.5 -59 1.5"

[[step]]
look_at = [-0.5, -60.0, 5.0]

[[step]]
wait_ms = 11000

[[step]]
screenshot = "pool"

# The water source spreads; leave the shared world dry for other scenes.
[[step]]
chat = "/fill -12 -60 -6 12 -59 14 minecraft:air replace minecraft:water"
