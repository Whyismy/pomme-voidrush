# Primed TNT (vanilla TntRenderer): it flashes white for five ticks in every
# ten and swells over its last ten.

[[step]]
wait_ms = 2000

[[step]]
chat = "/gamerule send_command_feedback false"

[[step]]
chat = "/gamerule tnt_explodes false"

[[step]]
chat = "/time set 6000"

[[step]]
chat = "/gamemode spectator"

[[step]]
chat = "/tp @s 520.5 -59 516.5 0 10"

[[step]]
wait_ms = 1500

[[step]]
chat = "/summon minecraft:tnt 520.5 -60 520.5 {fuse:400}"

[[step]]
chat = "/summon minecraft:tnt 522.5 -60 520.5 {fuse:395}"

[[step]]
chat = "/summon minecraft:tnt 518.5 -60 520.5 {fuse:12}"

[[step]]
wait_ms = 250

[[step]]
screenshot = "flash"
