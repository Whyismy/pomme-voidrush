# A lit creeper (vanilla CreeperRenderer): it fattens as its fuse runs, with
# a shudder, and flashes white every other tenth of the fuse.

[[step]]
wait_ms = 2000

[[step]]
chat = "/gamerule send_command_feedback false"

[[step]]
chat = "/gamerule mob_griefing false"

[[step]]
chat = "/time set 18000"

[[step]]
chat = "/gamemode spectator"

[[step]]
chat = "/tp @s 540.5 -59 535.5 0 5"

[[step]]
wait_ms = 3000

[[step]]
chat = "/kill @e[type=creeper]"

[[step]]
chat = "/execute at @s run summon minecraft:creeper ~-1 ~-1 ~5 {NoAI:1b,Silent:1b,PersistenceRequired:1b,Rotation:[180f,0f]}"

[[step]]
chat = "/execute at @s run summon minecraft:creeper ~1 ~-1 ~5 {NoAI:1b,Silent:1b,PersistenceRequired:1b,Rotation:[180f,0f],ignited:1b,Fuse:400}"

[[step]]
wait_ms = 1300

[[step]]
screenshot = "swelling"

[[step]]
wait_ms = 100

[[step]]
screenshot = "swelling_2"
