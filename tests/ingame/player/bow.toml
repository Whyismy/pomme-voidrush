# Drawing a bow and letting go shoots an arrow (an arrow leaves the
# inventory), and the arrow draws in flight and stuck in the ground.

[[step]]
wait_ms = 2000

[[step]]
chat = "/gamerule send_command_feedback false"

[[step]]
chat = "/time set 6000"

[[step]]
chat = "/gamemode survival"

[[step]]
chat = "/clear @s"

[[step]]
chat = "/tp @s 600.5 -60 600.5 0 20"

[[step]]
chat = "/give @s minecraft:bow"

[[step]]
chat = "/give @s minecraft:arrow 5"

[[step]]
wait_ms = 1000

[[step]]
mouse_down = "right"

[[step]]
wait_ms = 1200

[[step]]
screenshot = "drawn"

[[step]]
mouse_up = "right"

[[step]]
expect = { slot = 37, item = "arrow", count = 4 }

# Arrows that can't be picked up: one stuck after a fall, one flying past
# slowly, a tipped one and a spectral one.
[[step]]
chat = "/gamemode spectator"

[[step]]
chat = "/tp @s 600.5 -59.5 600.5 0 8"

[[step]]
chat = "/execute at @s run summon minecraft:arrow ~-1 ~2 ~4 {Motion:[0.0d,-0.2d,0.05d]}"

[[step]]
chat = "/execute at @s run summon minecraft:arrow ~0 ~2 ~4 {Motion:[0.05d,-0.2d,0.0d],item:{id:\"minecraft:tipped_arrow\",count:1,components:{\"minecraft:potion_contents\":{potion:\"minecraft:poison\"}}}}"

[[step]]
chat = "/execute at @s run summon minecraft:spectral_arrow ~1 ~2 ~4 {Motion:[0.0d,-0.2d,-0.05d]}"

[[step]]
wait_ms = 11000

[[step]]
screenshot = "arrows"

[[step]]
chat = "/tp @s 600.5 -55 604.5 0 90"

[[step]]
wait_ms = 1500

[[step]]
screenshot = "arrows_above"
