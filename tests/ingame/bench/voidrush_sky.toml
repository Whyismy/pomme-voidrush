# Void Rush's OptiFine custom sky (optifine/sky/world0): day, dusk and an
# aurora night (days 1, 3 and 6 of 8). Needs the pack served and
# POMME_INGAME_SERVER_PROPERTIES naming it, like voidrush_pack.

[[step]]
wait_ms = 15000

[[step]]
chat = "/weather clear"

[[step]]
chat = "/time set 6000"

[[step]]
chat = "/tp @s 0 -59 0 0 -35"

[[step]]
wait_ms = 11000

[[step]]
look_at = [0.0, 40.0, 60.0]

[[step]]
wait_ms = 1500

[[step]]
screenshot = "sky_day"

[[step]]
chat = "/time set 12600"

[[step]]
wait_ms = 11000

[[step]]
look_at = [60.0, 20.0, 0.0]

[[step]]
wait_ms = 1500

[[step]]
screenshot = "sky_dusk"

[[step]]
chat = "/time set 42000"

[[step]]
wait_ms = 11000

[[step]]
look_at = [0.0, 60.0, 30.0]

[[step]]
wait_ms = 1500

[[step]]
screenshot = "sky_aurora_night"
