# A zombie burning in daylight (fire resistant, so no hurt flash) wears
# vanilla's stack of flames; a blaze, fire immune, doesn't.

[[step]]
wait_ms = 15000

[[step]]
chat = "/time set 6000"

[[step]]
chat = "/summon minecraft:zombie -1.5 -60 4.5 {NoAI:1b,Silent:1b,Fire:2000s,Tags:[\"lit\"]}"

[[step]]
chat = "/effect give @e[type=zombie,tag=lit] minecraft:fire_resistance infinite 0 true"

[[step]]
chat = "/summon minecraft:blaze 2.5 -60 4.5 {NoAI:1b,Silent:1b}"

[[step]]
chat = "/tp @s 0.5 -59 -1.5 0 5"

[[step]]
wait_ms = 6000

[[step]]
screenshot = "burning"
