# A structure block's screen, for an operator in creative mode: it opens on
# the block's own data in the block's mode, and its buttons send the lot.

# Another scene on this server may have turned the feedback off.
[[step]]
chat = "/gamerule send_command_feedback true"

[[step]]
chat = "/gamemode creative"

[[step]]
chat = "/tp @s 5100.5 -60 1100.5 0 20"

[[step]]
wait_ms = 1500

[[step]]
chat = '/setblock 5100 -60 1102 minecraft:structure_block[mode=save]{mode:"SAVE",name:"pomme:test",posX:0,posY:1,posZ:0,sizeX:2,sizeY:2,sizeZ:2}'

[[step]]
look_at = [5100.5, -59.5, 1102.0]

[[step]]
wait_ms = 400

[[step]]
mouse_down = "right"

[[step]]
wait_ms = 100

[[step]]
mouse_up = "right"

[[step]]
wait_ms = 700

[[step]]
screenshot = "save"

# SAVE writes the structure.
[[step]]
cursor = [342, 195]

[[step]]
mouse_down = "left"

[[step]]
mouse_up = "left"

[[step]]
expect = { chat = "pomme:test" }

# The same block in its loading mode.
[[step]]
chat = '/setblock 5100 -60 1102 minecraft:structure_block[mode=load]{mode:"LOAD",name:"pomme:test",rotation:"CLOCKWISE_90"}'

[[step]]
wait_ms = 600

[[step]]
mouse_down = "right"

[[step]]
wait_ms = 100

[[step]]
mouse_up = "right"

[[step]]
wait_ms = 700

[[step]]
screenshot = "load"

[[step]]
close_menu = true

[[step]]
press = { action = "key.menu" }

[[step]]
wait_ms = 300

[[step]]
chat = "/setblock 5100 -60 1102 minecraft:air"

[[step]]
chat = "/gamemode survival"
