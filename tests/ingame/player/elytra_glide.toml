# Gliding: from high up, a press of jump in the air opens the elytra, and
# looking level the player then loses only a few blocks of height in four
# seconds, where a plain fall would have lost seventy. Seen from behind,
# the player lies along the glide with the wings spread.

[[step]]
chat = "/item replace entity @s armor.chest with minecraft:elytra"

[[step]]
chat = "/tp @s 2300.5 140 600.5 0 0"

[[step]]
wait_ms = 500

[[step]]
press = { action = "key.jump", hold = true }

[[step]]
wait_ms = 150

[[step]]
press = { action = "key.jump", hold = false }

[[step]]
wait_ms = 4000

[[step]]
expect = { player = { y_between = [80.0, 139.5] } }
timeout_ms = 500

# A rocket fired while gliding carries the player along its look: three
# seconds on it is near z 789, where the glide alone would have got to 760.
[[step]]
chat = "/item replace entity @s weapon.mainhand with minecraft:firework_rocket[minecraft:fireworks={flight_duration:3}] 8"

[[step]]
wait_ms = 300

[[step]]
mouse_down = "right"

[[step]]
wait_ms = 100

[[step]]
mouse_up = "right"

[[step]]
wait_ms = 3000

[[step]]
expect = { player = { z_between = [773.0, 100000.0] } }
timeout_ms = 500

[[step]]
press = { action = "key.togglePerspective" }

[[step]]
wait_ms = 300

[[step]]
screenshot = "gliding"
