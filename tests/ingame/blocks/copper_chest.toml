# A copper chest behind an invisible glowing marker armor stand (how Void
# Rush labels an outpost's chest): the stand neither outlines nor catches the
# crosshair, so right click opens the chest and holding left click breaks
# it. Then a bell (its body, and its swing when rung) and a burning player
# seen in third person.

[[step]]
wait_ms = 2000

[[step]]
chat = "/gamerule send_command_feedback false"

[[step]]
chat = "/gamemode survival"

[[step]]
chat = "/tp @s 620.5 -60 620.5 0 30"

[[step]]
wait_ms = 1000

[[step]]
look_at = [621.5, -61.0, 623.5]

[[step]]
wait_ms = 300

[[step]]
screenshot = "grass"

[[step]]
chat = "/setblock 620 -60 622 minecraft:copper_chest[facing=north]"

[[step]]
chat = "/summon armor_stand 620.5 -60 621.6 {Invisible:1b,Marker:1b,Glowing:1b,NoGravity:1b,CustomName:'Claim Outpost Here',CustomNameVisible:1b}"

[[step]]
wait_ms = 500

[[step]]
look_at = [620.5, -59.6, 622.5]

[[step]]
wait_ms = 300

[[step]]
screenshot = "targeted"

[[step]]
mouse_down = "right"

[[step]]
wait_ms = 100

[[step]]
mouse_up = "right"

[[step]]
wait_ms = 800

[[step]]
screenshot = "opened"

[[step]]
close_menu = true

[[step]]
wait_ms = 300

[[step]]
chat = "/give @s diamond_pickaxe"

[[step]]
wait_ms = 300

[[step]]
mouse_down = "left"

[[step]]
wait_ms = 1500

[[step]]
mouse_up = "left"

[[step]]
wait_ms = 500

[[step]]
expect = { block = "air", at = [620, -60, 622] }

[[step]]
chat = "/kill @e[type=armor_stand]"

[[step]]
chat = "/setblock 620 -60 622 minecraft:bell[attachment=floor,facing=north]"

[[step]]
wait_ms = 500

[[step]]
look_at = [620.5, -59.5, 622.5]

[[step]]
wait_ms = 300

[[step]]
screenshot = "bell"

[[step]]
mouse_down = "right"

[[step]]
wait_ms = 100

[[step]]
mouse_up = "right"

[[step]]
wait_ms = 250

[[step]]
screenshot = "bell_rung"

[[step]]
chat = "/setblock 620 -60 620 minecraft:fire"

[[step]]
wait_ms = 800

[[step]]
press = { action = "key.togglePerspective" }

[[step]]
press = { action = "key.togglePerspective" }

[[step]]
wait_ms = 500

[[step]]
screenshot = "burning"
