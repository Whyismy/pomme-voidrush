# A hopper's and a dispenser's screens: their slots, with what was put in
# them, over the player's inventory.

[[step]]
chat = "/tp @s 3100.5 -60 600.5 0 30"

[[step]]
wait_ms = 1500

[[step]]
chat = "/setblock 3100 -60 602 minecraft:hopper"

[[step]]
chat = "/item replace block 3100 -60 602 container.0 with minecraft:diamond 5"

[[step]]
chat = "/item replace block 3100 -60 602 container.4 with minecraft:emerald 64"

[[step]]
look_at = [3100.5, -59.4, 602.5]

[[step]]
mouse_down = "right"

[[step]]
wait_ms = 100

[[step]]
mouse_up = "right"

[[step]]
expect = { slot = 0, item = "diamond" }

[[step]]
expect = { slot = 4, item = "emerald" }

[[step]]
wait_ms = 400

[[step]]
screenshot = "hopper"

[[step]]
close_menu = true

[[step]]
chat = "/setblock 3100 -60 602 minecraft:dispenser[facing=up]"

[[step]]
chat = "/item replace block 3100 -60 602 container.0 with minecraft:arrow 16"

[[step]]
chat = "/item replace block 3100 -60 602 container.8 with minecraft:fire_charge 3"

[[step]]
wait_ms = 500

[[step]]
mouse_down = "right"

[[step]]
wait_ms = 100

[[step]]
mouse_up = "right"

[[step]]
expect = { slot = 0, item = "arrow" }

[[step]]
expect = { slot = 8, item = "fire_charge" }

[[step]]
wait_ms = 400

[[step]]
screenshot = "dispenser"

[[step]]
close_menu = true
