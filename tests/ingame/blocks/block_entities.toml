# player head, lectern, enchanting table, campfire, brewing stand, beacon,
# ender chest, spawner, trial spawner, vault, dragon head and creeper head;
# on the wall behind a wall sign, wall banner, wall skull, dragon wall head
# and a wall hanging sign, and a hanging sign under a block at the west end.

