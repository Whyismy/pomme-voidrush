# End crystals (EndCrystalRenderer): one on obsidian with its bedrock base,
# one without; the glass spins and bobs above the base.

[[step]]
wait_ms = 15000

[[step]]
chat = "/time set 6000"

[[step]]
chat = "/setblock -1 -60 5 minecraft:obsidian"

[[step]]
chat = "/summon minecraft:end_crystal -0.5 -59 5.5"

[[step]]
chat = "/setblock 3 -60 5 minecraft:obsidian"

[[step]]
chat = "/summon minecraft:end_crystal 3.5 -59 5.5 {ShowBottom:0b}"

[[step]]
chat = "/tp @s 1.5 -59 -1.5 0 5"

[[step]]
wait_ms = 6000

[[step]]
screenshot = "crystals"
