# Minecarts and boats (vanilla MinecartRenderer and BoatRenderer). Back row,
# on a line of rails that climbs at its east end: a hopper cart, a plain
# one, a TNT cart, and a chest cart tipped up the slope; a furnace cart
# and a spawner cart stand off the rails. Front row: an oak boat with a
# villager in it, a bamboo raft, a cherry chest boat and a spruce boat
# turned side on.

[[step]]
wait_ms = 15000

[[step]]
chat = "/gamerule send_command_feedback false"

[[step]]
chat = "/time set 6000"

[[step]]
chat = "/gamemode spectator"

[[step]]
chat = "/tp @s 902.5 -57.2 598.5 0 20"

[[step]]
wait_ms = 2500

[[step]]
chat = "/setblock 905 -60 606 minecraft:stone"

[[step]]
chat = "/setblock 905 -59 606 minecraft:rail"

[[step]]
chat = "/fill 900 -60 606 904 -60 606 minecraft:rail"

[[step]]
chat = "/summon minecraft:hopper_minecart 900.5 -60 606.5"

[[step]]
chat = "/summon minecraft:minecart 901.5 -60 606.5"

[[step]]
chat = "/summon minecraft:tnt_minecart 902.7 -60 606.5"

[[step]]
chat = "/summon minecraft:chest_minecart 904.5 -59.5 606.5"

[[step]]
chat = "/summon minecraft:furnace_minecart 898.5 -60 606.5 {NoGravity:1b}"

[[step]]
chat = "/summon minecraft:spawner_minecart 897.0 -60 606.5 {NoGravity:1b}"

# A plain cart set to show a block of diamond, raised.
[[step]]
chat = "/summon minecraft:minecart 895.5 -60 606.5 {NoGravity:1b,DisplayState:{Name:\"minecraft:diamond_block\"},DisplayOffset:10}"

[[step]]
chat = "/summon minecraft:oak_boat 899.5 -60 602.5 {Rotation:[180f,0f],Passengers:[{id:\"minecraft:villager\",NoAI:1b,Silent:1b}]}"

[[step]]
chat = "/summon minecraft:bamboo_raft 902.0 -60 602.5 {Rotation:[180f,0f]}"

[[step]]
chat = "/summon minecraft:cherry_chest_boat 904.5 -60 602.5 {Rotation:[180f,0f]}"

[[step]]
chat = "/summon minecraft:spruce_boat 907.0 -60 602.5 {Rotation:[90f,0f]}"

[[step]]
wait_ms = 3000

[[step]]
screenshot = "vehicles"

[[step]]
chat = "/kill @e[type=!minecraft:player,distance=..40]"

[[step]]
chat = "/fill 900 -60 606 905 -59 606 minecraft:air"

[[step]]
chat = "/kill @e[type=minecraft:item,distance=..40]"

[[step]]
chat = "/gamemode creative"
