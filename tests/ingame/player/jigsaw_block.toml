# A jigsaw's screen, for an operator in creative mode: it opens on the
# block's own data, and Done sends what it shows.

# Another scene on this server may have turned the feedback off.
[[step]]
chat = "/gamerule send_command_feedback true"

[[step]]
chat = "/gamemode creative"

[[step]]
chat = "/tp @s 5000.5 -60 1000.5 0 20"

[[step]]
wait_ms = 1500

[[step]]
chat = '/setblock 5000 -60 1002 minecraft:jigsaw[orientation=up_north]{pool:"minecraft:empty",name:"pomme:door",target:"pomme:door",final_state:"minecraft:stone",joint:"rollable"}'

[[step]]
look_at = [5000.5, -59.5, 1002.0]

[[step]]
wait_ms = 400

[[step]]
mouse_down = "right"

[[step]]
wait_ms = 100

[[step]]
mouse_up = "right"

[[step]]
wait_ms = 700

[[step]]
screenshot = "opened"

# Rollable becomes Aligned.
[[step]]
cursor = [317, 170]

[[step]]
mouse_down = "left"

[[step]]
mouse_up = "left"

[[step]]
wait_ms = 300

[[step]]
screenshot = "aligned"

# Done.
[[step]]
cursor = [134, 220]

[[step]]
mouse_down = "left"

[[step]]
mouse_up = "left"

[[step]]
wait_ms = 500

[[step]]
chat = "/data get block 5000 -60 1002 joint"

[[step]]
expect = { chat = "aligned" }

[[step]]
chat = "/setblock 5000 -60 1002 minecraft:air"

[[step]]
chat = "/gamemode survival"
