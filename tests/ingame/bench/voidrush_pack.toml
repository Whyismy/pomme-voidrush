# Void Rush's own resource pack on 1.21.11: plain base items (bottom row)
# against the same items with the pack's custom_model_data strings (middle
# row), then a dyed and a custom leather helmet (top row). Fork-only: run with
# the pack served locally and POMME_INGAME_SERVER_PROPERTIES naming it
# (resource-pack, resource-pack-sha1, require-resource-pack=true). The
# hotbar holds the custom items, for the GUI path.

[[step]]
wait_ms = 15000

[[step]]
chat = "/time set 6000"

[[step]]
chat = "/fill 0 -60 8 12 -54 8 minecraft:black_concrete"

[[step]]
chat = "/tp @s 6.5 -59 -1.5 0 0"

[[step]]
chat = "/summon minecraft:item_display 1.5 -59.5 6.5 {Rotation:[180f,0f],item:{id:\"minecraft:bone\",count:1},item_display:\"fixed\"}"

[[step]]
chat = "/summon minecraft:item_display 1.5 -57.5 6.5 {Rotation:[180f,0f],item:{id:\"minecraft:bone\",count:1,components:{\"minecraft:custom_model_data\":{strings:[\"elite_staff_1\"]}}},item_display:\"fixed\"}"

[[step]]
chat = "/summon minecraft:item_display 3.5 -59.5 6.5 {Rotation:[180f,0f],item:{id:\"minecraft:cod\",count:1},item_display:\"fixed\"}"

[[step]]
chat = "/summon minecraft:item_display 3.5 -57.5 6.5 {Rotation:[180f,0f],item:{id:\"minecraft:cod\",count:1,components:{\"minecraft:custom_model_data\":{strings:[\"raw_sea_meat\"]}}},item_display:\"fixed\"}"

[[step]]
chat = "/summon minecraft:item_display 5.5 -59.5 6.5 {Rotation:[180f,0f],item:{id:\"minecraft:iron_helmet\",count:1},item_display:\"fixed\"}"

[[step]]
chat = "/summon minecraft:item_display 5.5 -57.5 6.5 {Rotation:[180f,0f],item:{id:\"minecraft:iron_helmet\",count:1,components:{\"minecraft:custom_model_data\":{strings:[\"elite_iron_helmet\"]}}},item_display:\"fixed\"}"

[[step]]
chat = "/summon minecraft:item_display 7.5 -59.5 6.5 {Rotation:[180f,0f],item:{id:\"minecraft:heart_of_the_sea\",count:1},item_display:\"fixed\"}"

[[step]]
chat = "/summon minecraft:item_display 7.5 -57.5 6.5 {Rotation:[180f,0f],item:{id:\"minecraft:heart_of_the_sea\",count:1,components:{\"minecraft:custom_model_data\":{strings:[\"skillers_charm\"]}}},item_display:\"fixed\"}"

[[step]]
chat = "/summon minecraft:item_display 9.5 -59.5 6.5 {Rotation:[180f,0f],item:{id:\"minecraft:bow\",count:1},item_display:\"fixed\"}"

[[step]]
chat = "/summon minecraft:item_display 9.5 -57.5 6.5 {Rotation:[180f,0f],item:{id:\"minecraft:bow\",count:1,components:{\"minecraft:custom_model_data\":{strings:[\"elite_bow_1\"]}}},item_display:\"fixed\"}"

[[step]]
chat = "/summon minecraft:item_display 11.5 -59.5 6.5 {Rotation:[180f,0f],item:{id:\"minecraft:copper_spear\",count:1},item_display:\"fixed\"}"

[[step]]
chat = "/summon minecraft:item_display 11.5 -57.5 6.5 {Rotation:[180f,0f],item:{id:\"minecraft:copper_spear\",count:1,components:{\"minecraft:custom_model_data\":{strings:[\"elite_spear_1\"]}}},item_display:\"fixed\"}"

[[step]]
chat = "/summon minecraft:item_display 4.5 -55.5 6.5 {Rotation:[180f,0f],item:{id:\"minecraft:leather_helmet\",count:1,components:{\"minecraft:dyed_color\":16711680}},item_display:\"fixed\"}"

[[step]]
chat = "/summon minecraft:item_display 8.5 -55.5 6.5 {Rotation:[180f,0f],item:{id:\"minecraft:leather_helmet\",count:1,components:{\"minecraft:custom_model_data\":{strings:[\"elite_leather_helmet\"]}}},item_display:\"fixed\"}"

[[step]]
chat = "/item replace entity @s hotbar.0 with minecraft:bone[minecraft:custom_model_data={strings:[\"elite_staff_1\"]}]"

[[step]]
chat = "/item replace entity @s hotbar.1 with minecraft:cod[minecraft:custom_model_data={strings:[\"raw_sea_meat\"]}]"

[[step]]
chat = "/item replace entity @s hotbar.2 with minecraft:iron_helmet[minecraft:custom_model_data={strings:[\"elite_iron_helmet\"]}]"

[[step]]
chat = "/item replace entity @s hotbar.3 with minecraft:heart_of_the_sea[minecraft:custom_model_data={strings:[\"skillers_charm\"]}]"

[[step]]
chat = "/item replace entity @s hotbar.4 with minecraft:bow[minecraft:custom_model_data={strings:[\"elite_bow_1\"]}]"

[[step]]
chat = "/item replace entity @s hotbar.5 with minecraft:copper_spear[minecraft:custom_model_data={strings:[\"elite_spear_1\"]}]"

# Long enough for the chat lines to fade from the shot.
[[step]]
wait_ms = 10500

[[step]]
look_at = [6.5, -57.5, 6.5]

[[step]]
wait_ms = 1000

[[step]]
screenshot = "voidrush_pack"

[[step]]
chat = "/kill @e[type=minecraft:item_display]"

[[step]]
chat = "/fill 0 -60 8 12 -54 8 minecraft:air"
