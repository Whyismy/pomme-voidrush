# The grindstone's, cartography table's, smithing table's and brewing
# stand's screens open, each on its own picture; the brewing stand shows
# its fuel and what it is brewing.

[[step]]
chat = "/tp @s 3200.5 -60 600.5 0 30"

[[step]]
wait_ms = 1500

[[step]]
chat = "/setblock 3200 -60 602 minecraft:grindstone[face=floor]"

[[step]]
look_at = [3200.5, -59.5, 602.5]

[[step]]
mouse_down = "right"

[[step]]
wait_ms = 100

[[step]]
mouse_up = "right"

[[step]]
wait_ms = 700

[[step]]
screenshot = "grindstone"

[[step]]
close_menu = true

[[step]]
chat = "/setblock 3200 -60 602 minecraft:cartography_table"

[[step]]
wait_ms = 400

[[step]]
mouse_down = "right"

[[step]]
wait_ms = 100

[[step]]
mouse_up = "right"

[[step]]
wait_ms = 700

[[step]]
screenshot = "cartography"

[[step]]
close_menu = true

[[step]]
chat = "/setblock 3200 -60 602 minecraft:smithing_table"

[[step]]
wait_ms = 400

[[step]]
mouse_down = "right"

[[step]]
wait_ms = 100

[[step]]
mouse_up = "right"

[[step]]
wait_ms = 700

[[step]]
screenshot = "smithing"

[[step]]
close_menu = true

[[step]]
chat = "/setblock 3200 -60 602 minecraft:brewing_stand"

[[step]]
chat = "/item replace block 3200 -60 602 container.0 with minecraft:potion[minecraft:potion_contents={potion:\"minecraft:water\"}]"

[[step]]
chat = "/item replace block 3200 -60 602 container.3 with minecraft:nether_wart 3"

[[step]]
chat = "/item replace block 3200 -60 602 container.4 with minecraft:blaze_powder 2"

[[step]]
wait_ms = 2500

[[step]]
look_at = [3200.5, -59.6, 602.5]

[[step]]
mouse_down = "right"

[[step]]
wait_ms = 100

[[step]]
mouse_up = "right"

[[step]]
expect = { slot = 3, item = "nether_wart" }

[[step]]
wait_ms = 700

[[step]]
screenshot = "brewing"

[[step]]
close_menu = true
