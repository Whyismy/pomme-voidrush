# The loom: a banner and a dye list the patterns they can make, and
# picking one puts the patterned banner in the result.

[[step]]
chat = "/tp @s 4400.5 -60 600.5 0 30"

[[step]]
wait_ms = 1500

[[step]]
chat = "/setblock 4400 -60 602 minecraft:loom"

[[step]]
chat = "/item replace entity @s hotbar.0 with minecraft:white_banner"

[[step]]
chat = "/item replace entity @s hotbar.1 with minecraft:red_dye"

[[step]]
look_at = [4400.5, -59.5, 602.5]

[[step]]
wait_ms = 500

[[step]]
mouse_down = "right"

[[step]]
wait_ms = 100

[[step]]
mouse_up = "right"

[[step]]
wait_ms = 800

[[step]]
click = { slot = 31, op = "quick_move" }

[[step]]
click = { slot = 32, op = "quick_move" }

[[step]]
expect = { slot = 1, item = "red_dye" }

[[step]]
wait_ms = 400

[[step]]
screenshot = "patterns"

# The second pattern's button, in GUI units at the harness's scale of
# three.
[[step]]
cursor = [206.3, 57.0]

[[step]]
mouse_down = "left"

[[step]]
wait_ms = 100

[[step]]
mouse_up = "left"

[[step]]
expect = { slot = 3, item = "white_banner" }

[[step]]
wait_ms = 400

[[step]]
screenshot = "picked"

[[step]]
close_menu = true
