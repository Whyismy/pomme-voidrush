# The stonecutter: stone in its input lists what it cuts into, and picking
# one puts it in the result.

[[step]]
chat = "/tp @s 3300.5 -60 600.5 0 30"

[[step]]
wait_ms = 1500

[[step]]
chat = "/setblock 3300 -60 602 minecraft:stonecutter"

[[step]]
chat = "/item replace entity @s hotbar.0 with minecraft:stone 8"

[[step]]
look_at = [3300.5, -59.8, 602.5]

[[step]]
mouse_down = "right"

[[step]]
wait_ms = 100

[[step]]
mouse_up = "right"

[[step]]
wait_ms = 700

[[step]]
click = { slot = 29, op = "quick_move" }

[[step]]
expect = { slot = 0, item = "stone" }

[[step]]
wait_ms = 500

[[step]]
screenshot = "options"

# The first option's button, in GUI units at the harness's scale of three.
[[step]]
cursor = [186.0, 62.0]

[[step]]
mouse_down = "left"

[[step]]
wait_ms = 100

[[step]]
mouse_up = "left"

[[step]]
expect = { slot = 1, item = "chiseled_stone_bricks" }

[[step]]
wait_ms = 300

[[step]]
screenshot = "picked"

[[step]]
close_menu = true
